version: '3'

vars:
  # 対象 stage。STAGE=prd task ... で切り替える
  # devcontainer は backend 用に STAGE=local を持つ(CI は ci)。これらはデプロイ先ではないので dev に読み替える
  STAGE: '{{if or (eq .STAGE "local") (eq .STAGE "ci")}}dev{{else}}{{.STAGE | default "dev"}}{{end}}'
  PROJECT: snap-kakeibo
  # CDK は infra/common/const.go の AWSRegion を使う。aws CLI と scripts/ も同じリージョンを向くようにする。
  # Taskfile の env: はシェル側の環境変数(devcontainer の AWS_REGION など)に負けるので、コマンドごとに明示で渡す
  REGION: ap-northeast-2
  AWS: env -u AWS_ENDPOINT_URL AWS_REGION={{.REGION}} AWS_DEFAULT_REGION={{.REGION}}
  # image:push が付ける Lambda イメージのタグ。IMAGE_TAG=<sha> で上書き可
  IMAGE_TAG:
    sh: git rev-parse --short HEAD

tasks:
  setup:
    desc: Check the development tools and install dependencies when manifests exist
    cmds:
      - task: doctor
      - task: backend:setup
      - task: front:setup
      - task: infra:setup

  backend:setup:
    desc: Download Go dependencies when backend/go.mod exists
    cmds:
      - |
        if [ -f backend/go.mod ]; then
          cd backend
          go mod download
        fi

  front:setup:
    desc: Install React dependencies when front/package.json exists
    cmds:
      - |
        if [ -f front/pnpm-lock.yaml ]; then
          cd front
          pnpm install --frozen-lockfile
        elif [ -f front/package.json ]; then
          cd front
          pnpm install
        fi

  infra:setup:
    desc: Download Go dependencies for infra
    dir: infra
    cmds:
      - go mod download

  infra:test:
    desc: Run CDK stack assertions
    dir: infra
    cmds:
      - go test ./...

  infra:synth:
    desc: Synthesize CloudFormation templates for the stage
    dir: infra
    cmds:
      - '{{.AWS}} cdk synth --quiet -c stage={{.STAGE}} {{.CLI_ARGS}}'

  infra:diff:
    desc: Diff all stacks against the deployed state
    dir: infra
    cmds:
      - '{{.AWS}} cdk diff -c stage={{.STAGE}} {{.CLI_ARGS}}'

  infra:parameters:
    desc: Create missing SSM parameters for the stage (never overwrites)
    dir: infra
    cmds:
      - '{{.AWS}} go run ./cmd/ensure-parameters -stage {{.STAGE}}'

  infra:deploy:storage:
    desc: "Step 1: ensure SSM parameters, then deploy the storage stack (ECR / S3 / DynamoDB / SQS / SNS)"
    dir: infra
    cmds:
      - task: infra:parameters
      - '{{.AWS}} cdk deploy {{.STAGE}}-{{.PROJECT}}-storage --exclusively -c stage={{.STAGE}} {{.CLI_ARGS}}'

  infra:bootstrap:certificate:
    desc: Bootstrap us-east-1 for the CloudFront certificate stack (once per account)
    dir: infra
    cmds:
      - '{{.AWS}} cdk bootstrap aws://654654388040/us-east-1 {{.CLI_ARGS}}'

  infra:deploy:certificate:
    desc: Deploy the us-east-1 CloudFront certificate stack
    dir: infra
    cmds:
      - '{{.AWS}} cdk deploy {{.STAGE}}-{{.PROJECT}}-certificate --exclusively -c stage={{.STAGE}} {{.CLI_ARGS}}'

  image:push:
    desc: "Step 2a: build each Lambda image (linux/arm64), push it to the function's ECR and set its image-tag SSM parameter. FUNCTIONS='hello upload' limits the targets (default: all of backend/cmd). Needs Docker: run from the host or CI"
    cmds:
      - '{{.AWS}} bash scripts/push-image.sh {{.STAGE}} {{.PROJECT}} "{{.IMAGE_TAG}}" {{.FUNCTIONS}}'

  front:push:
    desc: "Step 2b: upload front/dist to the frontend bucket, then invalidate CloudFront if the app stack exists"
    cmds:
      - '{{.AWS}} aws s3 sync front/dist s3://{{.STAGE}}-{{.PROJECT}}-front --delete'
      - task: front:invalidate

  front:invalidate:
    desc: Invalidate the CloudFront cache (skipped when the app stack is not deployed yet)
    cmds:
      - |
        dist_id=$({{.AWS}} aws cloudformation describe-stacks \
          --stack-name {{.STAGE}}-{{.PROJECT}}-app \
          --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
          --output text 2>/dev/null || true)
        if [ -z "$dist_id" ] || [ "$dist_id" = "None" ]; then
          echo "app stack is not deployed yet; skipping invalidation"
          exit 0
        fi
        {{.AWS}} aws cloudfront create-invalidation --distribution-id "$dist_id" --paths '/*'

  infra:deploy:app:
    desc: "Step 3: deploy the app stack (Lambda / API Gateway / CloudFront). Each Lambda uses the image tag in its SSM parameter"
    cmds:
      - '{{.AWS}} bash scripts/check-image-tags.sh {{.STAGE}} {{.PROJECT}}'
      - cd infra && {{.AWS}} cdk deploy {{.STAGE}}-{{.PROJECT}}-app --exclusively -c stage={{.STAGE}} {{.CLI_ARGS}}

  infra:deploy:pipeline:
    desc: "Deploy the CD pipeline stack. Set /<stage>/snap-kakeibo/cicd/github-connection-arn before running"
    dir: infra
    cmds:
      - task: infra:parameters
      - '{{.AWS}} cdk deploy {{.STAGE}}-{{.PROJECT}}-pipeline --exclusively -c stage={{.STAGE}} {{.CLI_ARGS}}'

  infra:bootstrap:
    desc: Bootstrap the CDK toolkit stack in the target account (one time)
    dir: infra
    cmds:
      - '{{.AWS}} cdk bootstrap'

  floci:check:
    desc: Check local DynamoDB and S3 through Floci
    env:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_PROFILE: default
    cmds:
      - aws dynamodb list-tables
      - aws s3 ls

  local:seed:
    desc: Create the local tables / bucket / queue / JWT secret on Floci and a login user (EMAIL= PASSWORD= to override)
    dir: backend
    cmds:
      - go run ./tools/localseed -email "{{.EMAIL | default "dev@example.com"}}" -password "{{.PASSWORD | default "password"}}"

  local:api:
    desc: Serve the API Lambdas locally on :8080 against Floci (run local:seed first; pair with web:dev)
    dir: backend
    cmds:
      - go run ./tools/localapi

  doctor:
    desc: Check tool versions and ensure the container is running as dev
    cmds:
      - |
        test "$(id -u)" -ne 0
        test "$(id -un)" = dev
        go version
        node --version
        pnpm --version
        task --version
        aws --version
        gh --version
        cdk --version
        codex --version
        claude --version

  go:test:
    desc: Run Go tests when the module exists
    dir: backend
    cmds:
      - test -f go.mod
      - go test ./...

  web:dev:
    desc: Start the React development server on the forwarded port
    dir: front
    cmds:
      - pnpm dev --host 0.0.0.0

  web:build:
    desc: Build the React app
    dir: front
    cmds:
      - pnpm build

  web:test:
    desc: Run the React tests (vitest)
    dir: front
    cmds:
      - pnpm test

  codex:
    desc: Codex を起動（コンテナ内）
    interactive: true
    cmds:
      - codex --dangerously-bypass-approvals-and-sandbox

  claude:
    desc: Claude Code を起動（コンテナ内）
    interactive: true
    cmds:
      - claude --dangerously-skip-permissions
