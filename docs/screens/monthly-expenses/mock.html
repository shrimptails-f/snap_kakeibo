  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}button,input,select{font:inherit}button,a,input{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,dialog:focus-visible{outline:3px solid rgb(36 107 75/.3);outline-offset:2px}[hidden]{display:none!important}.shell{width:min(calc(100% - var(--pad)*2),var(--max));margin-inline:auto}.site-header{border-bottom:1px solid var(--border)}.site-header .shell{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;color:var(--primary);letter-spacing:-.02em}.sample{font-size:14px;color:var(--muted)}main{padding-block:20px 72px}.back{display:inline-flex;align-items:center;min-height:44px;color:var(--primary);font-weight:700;text-underline-offset:3px}.back:hover{color:var(--primary-hover)}.title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 18px}h1,h2,h3,p{margin-top:0}h1{margin-bottom:0;font-size:clamp(26px,4vw,34px);line-height:1.25;letter-spacing:-.035em}h2{margin-bottom:0;font-size:21px;line-height:1.35}h3{font-size:18px}.btn{min-height:44px;padding:8px 14px;border:1px solid #b8c2cc;border-radius:var(--r);background:#fff;color:var(--text);font-weight:700;cursor:pointer}.btn:hover{background:var(--sub)}.btn:disabled{cursor:not-allowed;opacity:.5}.btn--primary{border-color:var(--primary);background:var(--primary);color:#fff}.btn--primary:hover{background:var(--primary-hover)}.btn--quiet{border-color:transparent;color:var(--primary)}.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:28px}.month-nav{display:flex;align-items:center;gap:8px}.month-btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:6px 10px;border-radius:var(--r);color:var(--primary);font-weight:700;text-decoration:none}.month-btn:hover{background:var(--primary-subtle)}input[type=month]{height:44px;min-width:164px;padding:8px 10px;border:1px solid #b8c2cc;border-radius:var(--r);background:#fff;color:var(--text);font-weight:700}.reload{margin-left:auto}.total{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;padding:22px 0 26px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.eyebrow{margin:0 0 2px;color:var(--muted);font-weight:700}.total-amount{font-size:clamp(34px,6vw,48px);line-height:1.2;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.counts{margin:0 0 4px;color:var(--muted);font-weight:600}.notice{margin:18px 0 0;padding:12px 16px;border:1px solid #d9a48e;border-radius:var(--r);background:var(--warning-subtle);color:#74310f}.notice--danger{border-color:#efb0b2;background:var(--danger-subtle);color:var(--danger)}.notice--info{border-color:#afcbe8;background:var(--info-subtle);color:#204d80}.notice .btn{margin-top:8px}.section{padding:28px 0;border-bottom:1px solid var(--border)}.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:24px}.section-head .meta{color:var(--muted);font-weight:600}.breakdown{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:clamp(28px,6vw,72px);align-items:center}.pie-wrap{display:grid;place-items:center}.pie{width:min(260px,72vw);aspect-ratio:1;border-radius:50%;position:relative}.pie:after{position:absolute;inset:27%;display:grid;place-items:center;border-radius:50%;background:#fff;content:"内訳";color:var(--muted);font-size:14px;font-weight:700}.legend-table{width:100%;border-collapse:collapse}.legend-table th,.legend-table td{padding:13px 8px;border-bottom:1px solid var(--border);text-align:left}.legend-table thead th{color:var(--muted);font-size:14px}.legend-table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.swatch{display:inline-block;width:12px;height:12px;margin-right:9px;border-radius:2px;vertical-align:-1px}.method-note{margin:22px 0 0;color:var(--muted);font-size:14px}.items-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}.sort-note{margin:0 0 12px;color:var(--muted);font-size:14px}.expense-list{margin:0;padding:0;list-style:none}.expense-row{border-top:1px solid var(--border)}.expense-link{display:grid;grid-template-columns:minmax(260px,1.6fr) minmax(180px,1fr) minmax(145px,.7fr) 112px 24px;gap:18px;align-items:center;min-height:104px;padding:17px 8px;color:var(--text);text-decoration:none}.expense-link:hover{background:var(--sub)}.item-name{font-weight:750;overflow-wrap:anywhere}.bar-track{height:7px;margin-top:9px;background:#e8eeea}.bar{height:100%;background:var(--primary)}.store,.item-meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}.amount{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.chevron{color:var(--primary);font-size:22px;font-weight:800}.empty{padding:40px 18px;text-align:center;background:var(--sub)}.empty h2{margin-bottom:8px}.loading{display:flex;align-items:center;justify-content:center;gap:12px;min-height:230px;font-weight:700}.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(1turn)}}.demo{position:fixed;z-index:20;right:16px;bottom:16px}.demo summary{display:flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid #d9a48e;border-radius:999px;background:var(--warning-subtle);color:#74310f;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 5px 18px rgb(27 31 36/.13)}.demo[open] summary{margin-bottom:8px}.demo-panel{width:min(320px,calc(100vw - 32px));padding:14px;border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:0 14px 40px rgb(27 31 36/.18)}.demo-panel label{display:block;margin-bottom:6px;font-size:14px;font-weight:700}.demo-panel select{width:100%;min-height:44px;padding:8px;border:1px solid #b8c2cc;border-radius:var(--r);background:#fff}.demo-help{margin:8px 0 0;color:var(--muted);font-size:13px}dialog{width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:0;border-radius:10px;color:var(--text);box-shadow:0 24px 80px rgb(27 31 36/.3)}dialog::backdrop{background:rgb(10 20 15/.58%)}.dialog-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-bottom:1px solid var(--border);background:#fff}.icon-btn{width:44px;height:44px;border:0;border-radius:var(--r);background:#fff;font-size:26px;cursor:pointer}.icon-btn:hover{background:var(--sub)}.dialog-body{padding:22px}.detail-total{padding:18px;border-left:4px solid var(--primary);background:var(--sub)}.detail-total strong{display:block;font-size:28px}.detail-list{margin:20px 0}.detail-list div{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}.detail-list dt{color:var(--muted)}.detail-list dd{margin:0;font-weight:650}.receipt-items{margin:0;padding:0;list-style:none}.receipt-items li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border)}.dialog-note{margin:18px 0 0;color:var(--muted);font-size:14px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:767px){.site-header .shell{height:56px}.sample{display:none}.title-row{display:block}.monthbar{flex-wrap:wrap}.month-nav{width:100%;display:grid;grid-template-columns:auto 1fr auto}.month-nav input{width:100%;min-width:0}.reload{margin-left:auto}.total{grid-template-columns:1fr}.counts{margin:0}.breakdown{grid-template-columns:1fr}.pie{width:min(224px,68vw)}.expense-link{display:grid;grid-template-columns:minmax(0,1fr) auto 24px;gap:4px 10px;padding:16px 4px}.item-main{grid-column:1/2}.expense-link>.amount{grid-column:2}.chevron{grid-column:3;grid-row:1;align-self:start}.date-store{grid-column:1/4;margin-top:7px}.item-meta{grid-column:1/4}.item-category{display:inline}.section{padding-block:24px}.section-head{display:block}.section-head .meta{display:block;margin-top:3px}.demo{bottom:10px}}
    @media(max-width:380px){.month-btn{padding-inline:4px}.btn{padding-inline:11px}.total-amount{font-size:34px}.legend-table th,.legend-table td{padding-inline:4px}.legend-table{font-size:14px}}
    @media(min-width:960px){:root{--pad:24px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.spinner{animation:none;border-top-color:var(--border);border-left-color:var(--primary)}}
    .pie-label{position:absolute;z-index:1;display:grid;place-items:center;width:28px;height:28px;border:2px solid #fff;border-radius:50%;background:#fff;font-size:13px;font-weight:900;box-shadow:0 1px 4px rgb(27 31 36/.22)}
    .category-key{display:inline-block;min-width:1.5em;font-weight:900}
    .status-toast{position:fixed;z-index:30;top:12px;left:50%;width:min(520px,calc(100vw - 32px));transform:translateX(-50%);padding:12px 16px;border:1px solid #afcbe8;border-radius:var(--r);background:var(--info-subtle);color:#204d80;box-shadow:0 8px 24px rgb(27 31 36/.16);font-weight:700}.status-toast:empty{display:none}
    .demo{position:static;width:min(calc(100% - var(--pad)*2),var(--max));margin:-42px auto 30px}.demo summary{width:max-content;margin-left:auto;box-shadow:none}.demo-panel{margin-left:auto}.detail-calc{margin:5px 0 0;color:var(--muted);font-size:14px}dialog::backdrop{background:rgb(10 20 15/58%)}
    @media(max-width:959px){.breakdown{grid-template-columns:1fr}.expense-link{display:grid;grid-template-columns:minmax(0,1fr) auto 24px;gap:4px 10px;padding:16px 4px}.item-main{grid-column:1}.expense-link>.amount{grid-column:2;grid-row:1;align-self:start}.chevron{grid-column:3;grid-row:1;align-self:start}.date-store{grid-column:1/4;margin-top:7px}.item-meta{grid-column:1/4}.item-category{display:inline}}
  </style>
</head>
<body>
  <header class="site-header"><div class="shell"><span class="brand">snap_kakeibo</span><span class="sample">画面設計用インタラクティブモック</span></div></header>
  <main class="shell" id="main"><a class="back" href="#" id="backLink">← ダッシュボード</a><div class="title-row"><h1>月別支出</h1></div>
    <nav class="monthbar" aria-label="表示月の切り替え"><div class="month-nav"><a class="month-btn" href="#" id="prevMonth">← 前月</a><label class="sr-only" for="monthInput">表示する月</label><input id="monthInput" type="month" value="2026-09"><a class="month-btn" href="#" id="nextMonth">翌月 →</a></div><button class="btn" id="thisMonth" type="button">今月</button><button class="btn reload" id="reload" type="button">再読み込み</button></nav>
    <div id="live" class="status-toast" role="status" aria-live="polite"></div><div id="content"></div>
  </main>
  <details class="demo"><summary>モックの状態を変更</summary><div class="demo-panel"><label for="stateSelect">表示状態</label><select id="stateSelect"><option value="normal">通常</option><option value="loading">初回取得中</option><option value="refresh-error">再取得失敗</option><option value="empty">空</option><option value="summary-error">月合計だけ失敗</option><option value="items-error">明細だけ失敗</option><option value="all-error">両方失敗</option><option value="mismatch">集計と明細の不整合</option><option value="zero">明細合計0円</option><option value="negative">負の計上額・明細</option></select><p class="demo-help">設計確認用です。API通信は行いません。</p></div></details>
  <dialog id="detailDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">支出詳細</h2><button class="icon-btn" id="closeDialog" type="button" aria-label="支出詳細を閉じる">×</button></div><div class="dialog-body" id="dialogBody"></div></dialog>
  <script>
    const data={
      '2026-09':{total:12000,expenses:4,items:[
        {id:'rice',expense:'sakura',name:'米 5kg',amount:5000,date:'9月15日',store:'スーパーさくら',category:'food',qty:1,source:'AI解析'},
        {id:'detergent',expense:'daily',name:'洗剤セット',amount:4500,date:'9月12日',store:'日用品ストア',category:'daily_goods',qty:1,source:'編集済み'},
        {id:'unknown',expense:'station',name:'商品A',amount:1500,date:'9月10日',store:'駅前ショップ',category:'unknown',qty:1,source:'AI解析'},
        {id:'vegetables',expense:'sakura',name:'野菜セット',amount:1200,date:'9月15日',store:'スーパーさくら',category:'food',qty:1,source:'AI解析'},
        {id:'milk',expense:'sakura',name:'牛乳',amount:800,date:'9月15日',store:'スーパーさくら',category:'food',qty:2,source:'AI解析'},
        {id:'bread',expense:'bakery',name:'パン',amount:500,date:'9月8日',store:'ベーカリー',category:'food',qty:1,source:'手動登録'}]},
      '2026-08':{total:8650,expenses:3,items:[{id:'meat',expense:'market',name:'精肉・野菜',amount:4200,date:'8月24日',store:'中央市場',category:'food',qty:1,source:'AI解析'},{id:'book',expense:'books',name:'料理の本',amount:2750,date:'8月17日',store:'まちの書店',category:'entertainment',qty:1,source:'編集済み'},{id:'soap',expense:'daily2',name:'石けん',amount:1700,date:'8月3日',store:'日用品ストア',category:'daily_goods',qty:2,source:'AI解析'}]},
      '2026-10':{total:0,expenses:0,items:[]}
    };
    const categoryDefinitions = {
      food: { label: '食費', color: 'var(--color-category-food)' },
      daily_goods: { label: '日用品', color: 'var(--color-category-daily-goods)' },
      medical: { label: '医療', color: 'var(--color-category-medical)' },
      transport: { label: '交通', color: 'var(--color-category-transport)' },
      utilities: { label: '水道・光熱・通信', color: 'var(--color-category-utilities)' },
      entertainment: { label: '娯楽', color: 'var(--color-category-entertainment)' },
      social: { label: '交際・会食', color: 'var(--color-category-social)' },
      clothing: { label: '衣類', color: 'var(--color-category-clothing)' },
      education: { label: '教育', color: 'var(--color-category-education)' },
      other: { label: 'その他', color: 'var(--color-category-other)' },
      unknown: { label: '分類不能', color: 'var(--color-category-unknown)' },
    };
    const categoryColor = id => (categoryDefinitions[id] || categoryDefinitions.unknown).color;
    const categoryLabel = id => (categoryDefinitions[id] || categoryDefinitions.unknown).label;
    const expenseRecords={sakura:{read:7000,adjustment:-1500,recorded:5500},daily:{read:4500,adjustment:0,recorded:4500},station:{read:1500,adjustment:0,recorded:1500},bakery:{read:500,adjustment:0,recorded:500},market:{read:4200,adjustment:0,recorded:4200},books:{read:2750,adjustment:0,recorded:2750},daily2:{read:1700,adjustment:0,recorded:1700}}; let state='normal'; let month='2026-09';
    const yen=n=>`${n<0?'−':''}${Math.abs(n).toLocaleString('ja-JP')}円`; const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const monthLabel=v=>{const [y,m]=v.split('-').map(Number);return `${y}年${m}月`};
    function shifted(v,d){const [y,m]=v.split('-').map(Number),x=new Date(y,m-1+d,1);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`}
    function current(){const m=Number(month.slice(5));if(state==='zero')return{total:0,expenses:2,items:[{id:'zero1',expense:'z1',name:'ポイント交換品',amount:0,date:`${m}月20日`,store:'交換カウンター',category:'other',qty:1,source:'手動登録'},{id:'zero2',expense:'z2',name:'試供品',amount:0,date:`${m}月3日`,store:'ドラッグストア',category:'daily_goods',qty:1,source:'AI解析'}]};if(state==='negative')return{total:-1200,expenses:2,items:[{id:'refund',expense:'return',name:'返品分',amount:-1500,date:`${m}月21日`,store:'生活雑貨店',category:'daily_goods',qty:1,source:'編集済み'},{id:'bag',expense:'store',name:'紙袋',amount:300,date:`${m}月21日`,store:'生活雑貨店',category:'other',qty:1,source:'AI解析'}]};return data[month]||{total:0,expenses:0,items:[]}}
    function categories(items){const map=new Map;items.forEach(x=>map.set(x.category,(map.get(x.category)||0)+x.amount));return Object.keys(categoryDefinitions).filter(id=>map.has(id)).map(id=>[id,map.get(id)])}
    function controls(){const p=shifted(month,-1),n=shifted(month,1),now=new Date,currentMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;document.querySelector('#monthInput').value=month;document.querySelector('#prevMonth').setAttribute('aria-label',`${monthLabel(p)}を表示`);document.querySelector('#nextMonth').setAttribute('aria-label',`${monthLabel(n)}を表示`);document.querySelector('#thisMonth').disabled=month===currentMonth;document.title=`${monthLabel(month)}の支出 — snap_kakeibo`}
    function totalMarkup(d,failed=false){return `<section aria-labelledby="totalHeading"><div class="total"><div><p class="eyebrow" id="totalHeading">${monthLabel(month)} 月合計（計上額）</p><div class="total-amount">${failed?'取得できませんでした':yen(d.total)}</div></div>${failed?'':`<p class="counts">支出 ${d.expenses}件 / 明細 ${d.items.length}件</p>`}</div>${d.total<0?'<div class="notice notice--info">返金などの調整により、今月の計上額はマイナスです。</div>':''}${failed?'<div class="notice notice--danger">月合計を読み込めませんでした。<br><button class="btn js-retry" type="button">月合計を再読み込み</button></div>':''}</section>`}
    function itemsMarkup(d){const sum=d.items.reduce((a,x)=>a+x.amount,0),cats=categories(d.items),hasNegative=d.items.some(x=>x.amount<0),allZero=sum===0&&!hasNegative,max=Math.max(0,...d.items.map(x=>x.amount));let pie='';if(hasNegative)pie='<div class="empty"><strong>負の明細金額が含まれるため、円グラフと割合は表示しません。</strong></div>';else if(allZero)pie='<div class="empty"><strong>明細金額の合計は0円です。</strong></div>';else{let at=0,stops=[],labels=[];cats.forEach(([c,a],i)=>{const start=at,next=at+a/sum*100,angle=(start+next)/2*3.6-90,r=36,x=50+Math.cos(angle*Math.PI/180)*r,y=50+Math.sin(angle*Math.PI/180)*r;if(a>0)stops.push(`var(--bg) ${start}% ${Math.min(start+.3,next)}%`,`${categoryColor(c)} ${Math.min(start+.3,next)}% ${next}%`);labels.push(`<span class="pie-label" style="left:calc(${x}% - 14px);top:calc(${y}% - 14px)">${String.fromCharCode(65+i)}</span>`);at=next});pie=`<div class="pie-wrap" aria-hidden="true"><div class="pie" style="background:conic-gradient(${stops.join(',')})">${labels.join('')}</div></div>`}const rows=cats.map(([c,a],i)=>`<tr><th scope="row"><span class="swatch" style="background:${categoryColor(c)}"></span><span class="category-key">${String.fromCharCode(65+i)}</span>${esc(categoryLabel(c))}</th><td class="num">${yen(a)}</td><td class="num">${hasNegative||sum===0?'—':`${(a/sum*100).toFixed(1)}%`}</td></tr>`).join('');const list=[...d.items].sort((a,b)=>b.amount-a.amount).map(x=>`<li class="expense-row"><a class="expense-link" href="#detail-${x.id}" data-item="${x.id}"><div class="item-main"><div class="item-name">${esc(x.name)}</div>${!hasNegative&&x.amount>0?`<div class="bar-track" aria-hidden="true"><div class="bar" style="width:${x.amount/max*100}%;background:${categoryColor(x.category)}"></div></div>`:''}</div><div class="date-store"><div>${x.date}</div><div class="store">${esc(x.store)}</div></div><div class="item-meta"><span class="item-category"><span class="swatch" style="background:${categoryColor(x.category)}" aria-hidden="true"></span>${esc(categoryLabel(x.category))}</span><br>数量${x.qty} · ${x.source}</div><div class="amount">${yen(x.amount)}</div><span class="chevron" aria-hidden="true">›</span></a></li>`).join('');return `<section class="section" aria-labelledby="breakdownHeading"><div class="section-head"><h2 id="breakdownHeading">カテゴリ別内訳</h2><span class="meta">明細合計 ${yen(sum)}</span></div><div class="breakdown">${pie}<table class="legend-table"><thead><tr><th>カテゴリ</th><th class="num">明細金額</th><th class="num">割合</th></tr></thead><tbody>${rows}</tbody></table></div><p class="method-note">内訳は明細金額に基づきます。調整や読取金額との差により、月合計と一致しない場合があります。割合は小数1桁に丸めるため、合計が100%にならない場合があります。AIによるカテゴリは参考値です。</p></section><section class="section" aria-labelledby="itemsHeading"><div class="items-head"><h2 id="itemsHeading" tabindex="-1">支出明細</h2><span>${d.items.length}件</span></div><p class="sort-note">金額の大きい順</p><ul class="expense-list">${list}</ul></section>`}
    function render(){controls();const d=current(),c=document.querySelector('#content');if(state==='loading'){c.innerHTML='<div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>月別支出を読み込み中</div>';return}if(state==='all-error'){c.innerHTML='<div class="notice notice--danger"><h2>月別支出を読み込めませんでした</h2><p>通信状況を確認して、もう一度お試しください。</p><button class="btn js-retry" type="button">再読み込み</button></div>';bind();return}if(state==='empty'||(!d.items.length&&d.expenses===0)){c.innerHTML=`${totalMarkup({...d,total:0,expenses:0,items:[]})}<section class="section empty"><h2>この月の支出はまだありません</h2><p>レシートを取り込むと、ここで月ごとの支出を確認できます。</p><button class="btn btn--primary" id="uploadMock" type="button">レシートを取り込む</button></section>`;bind();return}if(state==='items-error'){c.innerHTML=totalMarkup(d)+`<section class="section"><div class="notice notice--danger"><h2>明細を読み込めませんでした</h2><p>月合計は取得できています。明細をもう一度読み込んでください。</p><button class="btn js-retry" type="button">明細を再読み込み</button></div></section>`;bind();return}c.innerHTML=(state==='refresh-error'?'<div class="notice notice--danger">更新できませんでした。前回取得した内容です。<br><button class="btn js-retry" type="button">もう一度更新</button></div>':'')+totalMarkup(d,state==='summary-error')+(state==='mismatch'?'<div class="notice">月合計と明細の情報が揃っていません。取得できた情報を表示しています。<br><button class="btn js-retry" type="button">再読み込み</button></div>':'')+itemsMarkup(d);bind()}
    function bind(){document.querySelectorAll('[data-item]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openDetail(a.dataset.item)}));document.querySelectorAll('.js-retry').forEach(b=>b.addEventListener('click',()=>{state='normal';document.querySelector('#stateSelect').value=state;render();reload()}));const u=document.querySelector('#uploadMock');if(u)u.addEventListener('click',()=>announce('モックのため、アップロード画面への遷移は行いません。'))}
    function openDetail(id){const d=current(),item=d.items.find(x=>x.id===id);if(!item)return;const same=d.items.filter(x=>x.expense===item.expense),sum=same.reduce((a,x)=>a+x.amount,0),record=expenseRecords[item.expense]||{read:sum,adjustment:0,recorded:sum};document.querySelector('#dialogTitle').textContent=`支出詳細：${item.store}`;document.querySelector('#dialogBody').innerHTML=`<div class="detail-total"><span>計上額（サンプル）</span><strong>${yen(record.recorded)}</strong><p class="detail-calc">読取金額 ${yen(record.read)} ＋ 調整額 ${yen(record.adjustment)}</p></div><dl class="detail-list"><div><dt>店舗名</dt><dd>${esc(item.store)}</dd></div><div><dt>購入日</dt><dd>${month.slice(0,4)}年${item.date}</dd></div></dl><h3>この支出の明細（合計 ${yen(sum)}）</h3><ul class="receipt-items">${same.map(x=>`<li><span>${esc(x.name)} <small>数量${x.qty}</small></span><strong>${yen(x.amount)}</strong></li>`).join('')}</ul><p class="dialog-note">計上額と明細合計は異なる値です。支出詳細画面の導線確認用で、編集や保存は行いません。</p>`;document.querySelector('#detailDialog').showModal()}
    function announce(s){const x=document.querySelector('#live');x.textContent='';setTimeout(()=>x.textContent=s,20);clearTimeout(announce.timer);announce.timer=setTimeout(()=>x.textContent='',4200)}
    function reload(){const b=document.querySelector('#reload');b.disabled=true;b.textContent='再読み込み中…';announce(`${monthLabel(month)}を再読み込み中`);setTimeout(()=>{if(state==='refresh-error'){state='normal';document.querySelector('#stateSelect').value=state;render()}b.textContent='再読み込み';announce('表示を更新しました');setTimeout(()=>b.disabled=false,2100)},900)}
    function changeMonth(v){month=v;state='normal';document.querySelector('#stateSelect').value=state;render();document.querySelector('#main').scrollIntoView();announce(`${monthLabel(month)}を表示しました`)}
    document.querySelector('#prevMonth').addEventListener('click',e=>{e.preventDefault();changeMonth(shifted(month,-1))});document.querySelector('#nextMonth').addEventListener('click',e=>{e.preventDefault();changeMonth(shifted(month,1))});document.querySelector('#monthInput').addEventListener('change',e=>{if(e.target.value)changeMonth(e.target.value)});document.querySelector('#thisMonth').addEventListener('click',()=>{const n=new Date;changeMonth(`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`)});document.querySelector('#reload').addEventListener('click',reload);document.querySelector('#stateSelect').addEventListener('change',e=>{state=e.target.value;render();announce(`モックを${e.target.options[e.target.selectedIndex].text}状態に変更しました`)});document.querySelector('#closeDialog').addEventListener('click',()=>document.querySelector('#detailDialog').close());document.querySelector('#detailDialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});document.querySelector('#backLink').addEventListener('click',e=>{e.preventDefault();announce('ダッシュボードはこのモックに含まれません。')});render();
  </script>
</body>
